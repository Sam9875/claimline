    title: Tenant-bias screening audit
    url: https://github.com/Sam9875/Tenant-bias-LLM
    skills: [fairness, evals, python]
    summary: |
      Public audit harness for language models used as rental screening
      assistants, set in Turin. The repository describes five real-style
      apartment listings and 480 synthetic applicant profiles, built as 24
      demographic or income combinations with 20 profiles each. The repository
      names Owl-alpha and Qwen as the models under test.
    metrics:
      listings: "5"
      synthetic_profiles: "480"
      demographic_combinations: "24"
      profiles_per_combination: "20"
    does_not_prove:
