  - id: prism-observatory
    title: PRISM Observatory
    url: https://github.com/Sam9875/prism-observatory
    skills: [rag, agents, evals, guardrails, python]
    summary: |
      Local retrieval-augmented generation workbench with three lenses.
      Glass is one hybrid retrieval over a lexical index and a dense index,
      fused by reciprocal rank fusion. Aurora is a LangGraph state machine
      that guards the question, routes, plans, retrieves, grades, rewrites,
      synthesizes, verifies, and guards the answer. Input checks reject an
      empty question, a question longer than 400 characters, an instruction
      override, and personal data such as an email, a phone number, or a card
      number. A cited sentence is kept only when that sentence appears in the
      passage it cites. The bench runs eight questions and reports support,
      precision, and latency. A static dashboard in the repository runs the
      same checks in the browser.
    metrics:
      lenses: "3"
      bench_questions: "8"
      max_question_characters: "400"
    does_not_prove:
      - a hosted chat model
      - production user traffic
      - fine-tuning

