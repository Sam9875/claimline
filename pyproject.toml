[project]
name = "claimline"
version = "0.1.0"
description = "Evaluation-gated agent that maps a job description to evidence you actually have."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Samesun Singh" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
claimline = "claimline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
